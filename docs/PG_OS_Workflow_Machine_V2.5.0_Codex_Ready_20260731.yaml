    flow_picker_hidden_from_normal_users: true
    fast_track_is_difference_review_not_auto_approval: true
  guided_component_registry:
    TASK_CONTEXT:
      purpose: 用一屏说明当前任务、为什么现在做、完成后进入哪里。
      required_ui:
      - title
      - goal
      - current_state
      - target_state
      - owner
      - due_at
      - estimated_effort
    SMART_FORM:
      purpose: 分组填写少量必要字段，自动继承已有事实。
      required_ui:
      - field_group
      - prefill_source
      - source_badge
      - inline_help
      - validation
    CHECKLIST_GUIDE:
      purpose: 逐项完成 Checklist，并显示证据、负责人和补救动作。
      required_ui:
      - item_status
      - rule
      - current_value
      - target_value
      - evidence
      - remediation
    EVIDENCE_CAPTURE:
      purpose: 上传、选择或自动关联日志、文档、报告和审批证据。
      required_ui:
      - evidence_type
      - source
      - preview
      - validity
      - owner
    DIFF_REVIEW:
      purpose: 显示变更前后差异和受影响审核。
      required_ui:
      - before
      - after
      - impact
      - stale_reviews
      - required_reapproval
    DECISION_OPTIONS:
      purpose: 以推荐方案和有限备选项支持审批。
      required_ui:
      - recommendation
      - alternatives
      - impacts
      - non_overridable_blocks
    METRIC_OBSERVATION:
      purpose: 展示灰度或放量指标、观察窗口和晋级差距。
      required_ui:
      - current_metrics
      - thresholds
      - window_progress
      - sample_progress
      - blocking_metrics
    DOCUMENT_REVIEW:
      purpose: 文档内容、结构化字段和审核意见并排展示。
      required_ui:
      - document_viewer
      - structured_terms
      - comments
      - risk_flags
      - change_request
    MATCH_BUILDER:
      purpose: 逐步输入广告主需求并生成媒体匹配。
      required_ui:
      - requirements
      - recommendations
      - match_reasons
      - restrictions
      - activation_path
    HANDOFF_CONFIRMATION:
      purpose: 确认交付物、接收人、截止时间和接受标准。
      required_ui:
      - sender
      - receiver
      - artifact
      - criteria
      - dependencies
      - due_at
    RISK_AND_REMEDIATION:
      purpose: 把失败原因转化为可以执行的补救任务。
      required_ui:
      - risk
      - impact
      - owner
      - action
      - due_at
      - recheck
    FINAL_REVIEW:
      purpose: 提交前统一检查输入、门槛、审批和副作用。
      required_ui:
      - summary
      - missing_items
      - approvers
      - side_effects
      - confirmation
    COMPLETION_AND_NEXT:
      purpose: 显示完成结果、责任转移和下一步。
      required_ui:
      - result
      - new_state
      - new_owner
      - next_action
      - notifications
    EMERGENCY_CONTROL:
      purpose: 在事故中以最短路径执行暂停、回滚和升级。
      required_ui:
      - pause_scope
      - rollback_option
      - incident_owner
      - confirmation
      - status
  guided_ui_state_registry:
    NOT_STARTED: 向导尚未开始
    IN_PROGRESS: 正在处理
    WAITING_FOR_USER: 等待当前用户输入
    WAITING_FOR_OTHER_ROLE: 等待其他角色
    BLOCKED: 存在阻断并已生成补救动作
    VALIDATING: 正在重新计算门槛
    READY_TO_SUBMIT: 已满足提交条件
    SUBMITTING: 正在执行事务
    COMPLETED: 已完成并进入下一节点
    PARTIALLY_COMPLETED: 部分副作用待异步完成
    STALE: 底层数据变化，需要刷新
    CANCELLED: 用户取消但草稿保留
