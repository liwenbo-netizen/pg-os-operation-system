    - HANDOFF_WAITING_ACCEPTANCE
    - CURRENT_NODE_REQUIRED_ACTION
    - REVIEW_EXPIRING
    - PROACTIVE_SUGGESTION
    result_fields:
    - action_code
    - why_now
    - impact_if_delayed
    - estimated_effort
    - due_at
    - primary_action
    - secondary_actions
    ai_usage:
      allowed:
