status_definitions:
  SKIP_PRESENT_AND_VALIDATED: "The task's required W0 output already exists and has W0 evidence. This does not assert every product feature is complete."
  READY: "The gap is evidenced, its dependencies are satisfied, and it is the next permitted product slice after baseline repair."
  BLOCKED: "The task is ordered behind unfinished dependency work, an unresolved baseline failure, or an unavailable environment capability."

